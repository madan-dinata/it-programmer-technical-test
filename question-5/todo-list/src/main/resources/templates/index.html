<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>To-Do List</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }

    h1 {
      text-align: center;
    }

    form {
      margin-bottom: 10px;
    }

    input {
      padding: 8px;
      width: 70%;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    li {
      margin: 10px 0;
    }
  </style>

</head>

<body>

  <h1>To-Do List</h1>

  <form th:action="@{/add}" method="post">

    <input type="text" name="title" placeholder="Enter task..." required>

    <button>Add</button>

  </form>

  <hr>

  <ul>

    <li th:each="task : ${tasks}">

      <span th:text="${task.title}" th:style="${task.completed} ? 'text-decoration: line-through;color:gray;' : ''">
      </span>

      <form th:action="@{/toggle/{id}(id=${task.id})}" method="post" style="display:inline;">

        <button>

          <span th:text="${task.completed} ? 'Undo' : 'Complete'"></span>

        </button>

      </form>

      <form th:action="@{/delete/{id}(id=${task.id})}" method="post" style="display:inline;">

        <button>

          Delete

        </button>

      </form>

    </li>

  </ul>

</body>

</html>
